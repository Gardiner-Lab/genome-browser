name: Release

# Pushing a version tag (v0.1.0) tests the code, then publishes the image as
# ghcr.io/gardiner-lab/genome-browser:0.1.0, :0.1 and :latest, for both Intel
# and ARM servers. Trellis Tools pins an exact version as GENOME_VERSION, so
# publishing here does not change any installation until the suite is updated
# to use it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gardiner-lab/genome-browser

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # pyBigWig has no wheel and is built from source: it needs these headers.
      # The runners' mirror (azure.archive.ubuntu.com) refuses to resolve now and
      # then, which failed whole releases, so give it a few goes before believing it.
      - name: Headers for building pyBigWig
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq \
               && sudo apt-get install -y -qq zlib1g-dev libcurl4-openssl-dev libssl-dev; then
              exit 0
            fi
            echo "apt failed (attempt $attempt); waiting before trying again"
            sleep $((attempt * 15))
          done
          # Best-effort on purpose. The runner image usually carries these headers already, and
          # the mirror (azure.archive.ubuntu.com) drops out for long stretches; failing here
          # blocked releases of code that builds perfectly well. If they really are missing,
          # the pip step below fails on its own, and says which header it wanted.
          echo "::warning::Could not reach the Ubuntu mirror; carrying on with the headers the runner has."
      - run: pip install -r requirements.txt
      # See ci.yml: the data root is made at import time.
      - run: pytest -q
        env:
          GENOME_DATA_ROOT: ${{ runner.temp }}/genome

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The version the health endpoint reports is a constant in the code, and
      # it is what scripts/check.sh in the suite compares its pin against. Left
      # unchecked it goes stale: the suite's backup service reported 2.32.0 for
      # four releases because nothing compared the two.
      - name: Check the tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n "s/^APP_VERSION = '\(.*\)'/\1/p" app.py)"
          [ "$tag" = "$code" ] || { echo "Tag v$tag but APP_VERSION is $code"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A release tag also moves :latest (metadata-action's default for semver).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
