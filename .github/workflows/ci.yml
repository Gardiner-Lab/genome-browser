name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # pyBigWig has no wheel and is built from source: it needs these headers.
      # The runners' mirror (azure.archive.ubuntu.com) refuses to resolve now and
      # then, which failed whole releases, so give it a few goes before believing it.
      - name: Headers for building pyBigWig
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update -qq \
               && sudo apt-get install -y -qq zlib1g-dev libcurl4-openssl-dev libssl-dev; then
              exit 0
            fi
            echo "apt failed (attempt $attempt); waiting before trying again"
            sleep $((attempt * 20))
          done
          echo "The Ubuntu mirror could not be reached after 5 attempts."
          exit 1
      - run: pip install -r requirements.txt
      # The application makes its data root when the module is imported, and
      # the default is /genome, the volume it has in the container: without
      # this, collection fails here as an ordinary user before a test runs.
      - run: pytest -q
        env:
          GENOME_DATA_ROOT: ${{ runner.temp }}/genome

      # The conversion toolchain lives in the image, not on this runner, so the
      # tests that use it skip above. Build the image and run them inside it.
      - name: The conversion toolchain, in the image
        run: |
          docker build -t genome-browser:ci .
          docker run --rm --user 0 -v "$PWD":/src:ro genome-browser:ci sh -c '
            mkdir -p /work && cp -r /src/. /work/ \
            && (for a in 1 2 3; do apt-get update -qq && apt-get install -y -qq python3-pytest >/dev/null && break || sleep $((a * 20)); done) \
            && cd /work && GENOME_DATA_ROOT=/tmp/genome python3 -m pytest -q test_smoke.py'
